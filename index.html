<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chronicle</title>
<style>
  html, body { margin: 0; background: #0b0b10; color: #e8e8f0;
    font-family: Georgia, "Times New Roman", serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 1rem; box-sizing: border-box; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  #title { font-size: 1rem; letter-spacing: 0.15em; text-transform: uppercase; margin: 0; }
  #badge { font-size: 0.7rem; letter-spacing: 0.2em; padding: 0.2em 0.6em; border: 1px solid #555; border-radius: 3px; }
  #badge[data-live="1"] { color: #ff6b6b; border-color: #ff6b6b; }
  #stage { position: relative; margin: 1rem 0; }
  /* the pixel stage: drawn small, scaled up with no smoothing (PNN's way) */
  #march { display: block; width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; border-radius: 8px; }
  #march-caption { min-height: 3em; margin-top: 0.5rem; padding: 0.6rem 1rem; line-height: 1.5; font-size: 1.05rem;
    color: #ffd9ec; background: #1c1c26; border-left: 4px solid #f4a6cf; }
  #march-caption:empty { opacity: 0.35; }
  #caption { margin: 0; padding: 1rem; background: #1c1c26; border-left: 4px solid #c9b26b;
    min-height: 3em; line-height: 1.5; font-size: 1.05rem; }
  #caption[data-on="0"] { opacity: 0.35; }
  #sound { font: inherit; padding: 0.5em 1em; margin: 0.5rem 0; background: #c9b26b; color: #0b0b10; border: 0; border-radius: 6px; }
  #note { font-size: 0.8rem; color: #9a9ab0; }
  h2 { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: #9a9ab0; margin: 1.5rem 0 0.5rem; }
  #sources { list-style: none; padding: 0; margin: 0; font-size: 0.85rem; color: #b0b0c4; }
  #sources li { padding: 0.3em 0.5em; border-left: 2px solid #333; margin-bottom: 0.3em; }
  #sources li.now { border-left-color: #c9b26b; color: #e8e8f0; }
  #sources span { color: #777; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 0.5em; }
  footer { font-size: 0.75rem; color: #777; margin-top: 2rem; line-height: 1.5; }
  footer a { color: #c9b26b; }
</style>
</head>
<body>
<main>
  <header><h1 id="title">chronicle</h1><span id="badge" data-live="0">…</span></header>
  <div id="stage">
    <!-- March (left) and the narrator (right), drawn by people.js; data-mood
         and data-action carry March's state for anything reading the page -->
    <canvas id="march" width="128" height="72" data-mood="neutral" data-action="none" aria-label="March and the narrator at their desk"></canvas>
    <div id="march-caption"></div>
  </div>
  <p id="caption" data-on="1"></p>
  <button id="sound">Tap for sound</button>
  <p id="note"></p>
  <h2>Sources</h2>
  <ul id="sources"></ul>
  <footer>The days of <a href="https://howisjason.com">Jason</a> (howisjason), told as chapters of an epic.
    AI-written and AI-voiced, from his real record; the sources for the chapter are listed above.
    Built in public at <a href="https://github.com/howisjason/chronicle">github.com/howisjason/chronicle</a>.</footer>
</main>
<script type="module" src="player.js"></script>
</body>
</html>
