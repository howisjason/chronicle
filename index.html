<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chronicle</title>
<style>
  /* Placeholder look for step 2. The real look is step 8 (the playbook). */
  html, body { margin: 0; background: #0b0b10; color: #e8e8f0;
    font-family: Georgia, "Times New Roman", serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 1rem; box-sizing: border-box; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  #title { font-size: 1rem; letter-spacing: 0.15em; text-transform: uppercase; margin: 0; }
  #badge { font-size: 0.7rem; letter-spacing: 0.2em; padding: 0.2em 0.6em; border: 1px solid #555; border-radius: 3px; }
  #badge[data-live="1"] { color: #ff6b6b; border-color: #ff6b6b; }
  #stage { position: relative; margin: 1rem 0; background: #14141c; border-radius: 12px;
    padding: 1rem; display: grid; grid-template-columns: 140px 1fr; gap: 1rem; align-items: center; }
  #march { width: 140px; height: 180px; }
  #march-caption { min-height: 4.5em; line-height: 1.5; font-size: 1.05rem; color: #ffd9ec; }
  #march-caption:empty::before { content: ""; }
  /* moods: eyes and brows switch by data-mood */
  #march .eye { fill: #0b0b10; }
  #march .brow { stroke: #0b0b10; stroke-width: 3; fill: none; }
  #march[data-mood="happy"] .eye { transform: scaleY(0.35) translateY(90px); }
  #march[data-mood="surprised"] .eye { transform: scale(1.6); }
  #march[data-mood="dry"] .brow { transform: translateY(-4px); }
  #march[data-mood="dry"] .eye { transform: scaleY(0.6) translateY(28px); }
  /* actions: an arm that points, a hand that comes up to the face */
  #march .arm { stroke: #ffb3d9; stroke-width: 10; stroke-linecap: round; fill: none; transition: transform 0.2s; }
  #march[data-action="point"] .arm.right { transform: rotate(-70deg); }
  #march[data-action="facepalm"] .arm.left { transform: rotate(-150deg) translate(-10px,0); }
  #caption { margin: 0; padding: 1rem; background: #1c1c26; border-left: 4px solid #c9b26b;
    min-height: 3em; line-height: 1.5; font-size: 1.05rem; }
  #caption[data-on="0"] { opacity: 0.35; }
  #sound { font: inherit; padding: 0.5em 1em; margin: 0.5rem 0; background: #c9b26b; color: #0b0b10; border: 0; border-radius: 6px; }
  #note { font-size: 0.8rem; color: #9a9ab0; }
  h2 { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: #9a9ab0; margin: 1.5rem 0 0.5rem; }
  #sources { list-style: none; padding: 0; margin: 0; font-size: 0.85rem; color: #b0b0c4; }
  #sources li { padding: 0.3em 0.5em; border-left: 2px solid #333; margin-bottom: 0.3em; }
  #sources li.now { border-left-color: #c9b26b; color: #e8e8f0; }
  #sources span { color: #777; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 0.5em; }
  footer { font-size: 0.75rem; color: #777; margin-top: 2rem; line-height: 1.5; }
  footer a { color: #c9b26b; }
</style>
</head>
<body>
<main>
  <header><h1 id="title">chronicle</h1><span id="badge" data-live="0">…</span></header>
  <div id="stage">
    <svg id="march" viewBox="-70 -90 140 180" data-mood="neutral" data-action="none" aria-label="March, placeholder figure">
      <!-- body -->
      <path class="arm left" d="M-28,20 L-48,60" style="transform-origin:-28px 20px"/>
      <path class="arm right" d="M28,20 L48,60" style="transform-origin:28px 20px"/>
      <rect x="-30" y="10" width="60" height="70" rx="18" fill="#ffb3d9"/>
      <!-- head -->
      <circle cx="0" cy="-30" r="42" fill="#ffd9ec"/>
      <path d="M-44,-40 Q0,-95 44,-40 Q30,-70 0,-72 Q-30,-70 -44,-40Z" fill="#ff8fc8"/>
      <path class="brow" d="M-28,-48 Q-18,-54 -8,-48"/>
      <path class="brow" d="M8,-48 Q18,-54 28,-48"/>
      <circle class="eye" cx="-18" cy="-32" r="5" style="transform-origin:-18px -32px"/>
      <circle class="eye" cx="18" cy="-32" r="5" style="transform-origin:18px -32px"/>
      <!-- mouth: the path is swapped by player.js (closed, half, open) -->
      <path id="mouth" d="M-14,18 Q0,22 14,18" transform="translate(0,-30)" fill="#7a1f4a" stroke="#7a1f4a" stroke-width="2"/>
    </svg>
    <div id="march-caption"></div>
  </div>
  <p id="caption" data-on="1"></p>
  <button id="sound">Tap for sound</button>
  <p id="note"></p>
  <h2>Sources</h2>
  <ul id="sources"></ul>
  <footer>AI-written and AI-voiced, from his real record. The sources for the chapter are listed above.
    Built in public at <a href="https://github.com/howisjason/chronicle">github.com/howisjason/chronicle</a>.</footer>
</main>
<script type="module" src="player.js"></script>
</body>
</html>
