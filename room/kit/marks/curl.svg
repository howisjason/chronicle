<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none" stroke="black" stroke-linecap="round">
  <!-- The curl: a gold hairline corner that turns in on itself like a cloud.
       One drawing, six named views. kit.css uses them as masks, so the curl
       takes whatever colour the token gives it:
         curl.svg#tl  #tr  #bl  #br   the four corners of a container (32 x 32)
         curl.svg#rule  #rule-r       a rule that ends in the curl (160 x 19)
       The corners sit 8 units apart so one corner's line end never shows in the next view. -->
  <view id="tl" viewBox="0 0 32 32"/>
  <view id="tr" viewBox="40 0 32 32"/>
  <view id="bl" viewBox="80 0 32 32"/>
  <view id="br" viewBox="120 0 32 32"/>
  <view id="rule" viewBox="0 40 160 19"/>
  <view id="rule-r" viewBox="0 60 160 19"/>
  <defs>
    <g id="corner">
      <path stroke-width="1.25" d="M1 32V11C1 5.5 5.5 1 11 1H32"/>
      <path stroke-width="1.25" d="M23 1C16 1 11.5 5.6 11.5 11"/>
      <path stroke-width="1" d="M11.5 11C11.5 14.8 14.3 17.4 17.8 17.4C21 17.4 23.2 15 23.2 12.3"/>
      <path stroke-width=".75" d="M23.2 12.3C23.2 10.2 21.7 8.9 20 8.9"/>
    </g>
    <g id="end">
      <path stroke-width="1.25" d="M160 1H14C7 1 2.5 5.6 2.5 11"/>
      <path stroke-width="1" d="M2.5 11C2.5 14.8 5.3 17.4 8.8 17.4C12 17.4 14.2 15 14.2 12.3"/>
      <path stroke-width=".75" d="M14.2 12.3C14.2 10.2 12.7 8.9 11 8.9"/>
    </g>
  </defs>
  <use href="#corner"/>
  <use href="#corner" transform="translate(40 0) matrix(-1 0 0 1 32 0)"/>
  <use href="#corner" transform="translate(80 0) matrix(1 0 0 -1 0 32)"/>
  <use href="#corner" transform="translate(120 0) matrix(-1 0 0 -1 32 32)"/>
  <use href="#end" transform="translate(0 40)"/>
  <use href="#end" transform="translate(0 60) matrix(-1 0 0 1 160 0)"/>
</svg>
