<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>March, cel-shaded</title>
<style>
  /* March drawn as clean cel-shaded vector, in the colours read off her own
     Live2D texture sheets. Everything is drawn once; only transforms move. */
  html, body { margin: 0; background: #0b0b10; color: #e8e8f0; font-family: Georgia, serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 1rem; box-sizing: border-box; }
  #stage { background: #14141c; border-radius: 12px; padding: 1rem; display: grid;
    grid-template-columns: 140px 1fr; gap: 1rem; align-items: center; }
  #march { width: 140px; height: 180px; display: block; overflow: visible; }
  #big { width: 280px; height: 360px; display: block; margin: 1rem auto 0; }
  #cap { color: #ffd9ec; line-height: 1.5; font-size: 1.05rem; }

  /* ---- palette, read off texture_00/01.png ---- */
  :root {
    --ink: #4a2b38;
    --hair: #fad2de; --hair-sh: #f0a9c6; --hair-deep: #d983a8; --hair-hi: #fff4f8;
    --skin: #fff2e8; --skin-sh: #f3c3c0; --blush: #ffb0b8;
    --white: #f6f6f6; --white-sh: #c4b8d2;
    --blue: #5fa9e0; --blue-sh: #3f7fc4; --purple: #a090e0; --purple-sh: #7f6cc4;
    --ribbon: #9dc8f2; --ribbon-sh: #5f92d8;
    --cam: #58cdd8; --cam-sh: #2fa3b3; --lens: #2b2b2b;
    --glove: #494948; --gold: #e7b94d; --choker: #2a2430;
    --eye-w: #f8f6f8; --iris: #3d6fcf; --iris-lo: #8fcbff; --pupil: #233c7a; --pink: #f7a7cf;
    --mouth: #a04565;
  }
  #march * { vector-effect: non-scaling-stroke; }
  .ink { stroke: var(--ink); stroke-width: 1.2px; stroke-linejoin: round; stroke-linecap: round; }
  .thin { stroke: var(--ink); stroke-width: 0.8px; stroke-linejoin: round; stroke-linecap: round; fill: none; }
  .nofill { fill: none; }

  /* ---- idle life: transforms only ---- */
  .head { transform-origin: 70px 118px; animation: sway 6s ease-in-out infinite; }
  .body { transform-origin: 70px 180px; animation: breathe 3.6s ease-in-out infinite; }
  .lockL { transform-origin: 40px 96px; animation: swingL 3.2s ease-in-out infinite; }
  .lockR { transform-origin: 100px 96px; animation: swingR 3.2s ease-in-out infinite; }
  .blink { transform-origin: 70px 77px; animation: blink 4.4s linear infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
  @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.018); } }
  @keyframes swingL { 0%,100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
  @keyframes swingR { 0%,100% { transform: rotate(2.2deg); } 50% { transform: rotate(-2.2deg); } }
  @keyframes blink { 0%,91% { transform: scaleY(0); } 94% { transform: scaleY(1); } 97%,100% { transform: scaleY(0); } }

  /* ---- moods: which drawn piece is visible ---- */
  .m-happy, .m-dry, .m-surprised, .m-dark, .wink { visibility: hidden; }
  #march[data-mood="happy"] .eyeR-open { visibility: hidden; }
  #march[data-mood="happy"] .wink, #march[data-mood="happy"] .m-happy { visibility: visible; }
  #march[data-mood="dry"] .m-dry, #march[data-mood="dry"] .m-dark { visibility: visible; }
  #march[data-mood="dry"] .brow { transform: translateY(3px); }
  #march[data-mood="surprised"] .m-surprised { visibility: visible; }
  #march[data-mood="surprised"] .pupil { visibility: hidden; }
  #march[data-mood="surprised"] .eyeL, #march[data-mood="surprised"] .eyeR { transform: scale(1.14); }
  #march[data-mood="surprised"] .brow { transform: translateY(-3px); }
  .eyeL { transform-origin: 57px 90px; transition: transform .2s; }
  .eyeR { transform-origin: 84px 90px; transition: transform .2s; }
  .brow { transition: transform .2s; }
  .mouth > * { visibility: hidden; }

  /* ---- actions: a drawn pose slides up from behind the body ---- */
  .pose { visibility: hidden; transform: translateY(36px); transition: transform .25s ease-out, visibility 0s .25s; }
  #march[data-action="point"] .pose-point, #march[data-action="facepalm"] .pose-palm { visibility: visible; transform: translateY(0); transition: transform .25s ease-out; }
  #march[data-action="point"] .armR, #march[data-action="facepalm"] .armL { visibility: hidden; }

  /* the test strip, outside #march */
  #strip { margin-top: 1.5rem; font-size: .8rem; color: #9a9ab0; }
  #strip p { margin: .4rem 0; }
  #strip button { font: inherit; padding: .35em .7em; margin: .15em; background: #2a2a38; color: #e8e8f0; border: 1px solid #444; border-radius: 6px; }
  #strip button[data-on="1"] { background: #c9b26b; color: #0b0b10; border-color: #c9b26b; }
</style>
</head>
<body>
<main>

        <path class="ink" fill="var(--skin)" d="M126,100 L130,90 C131,87 135,88 134,91 L131,102 Z"/>
      </g>
    </svg>
    <div id="cap">a bust, cel-shaded, in her own colours</div>
  </div>
  <svg id="big" viewBox="0 0 140 180"><use href="#march"/></svg>

  <div id="strip">
    <p>mood: <span id="moods"></span></p>
    <p>action: <span id="actions"></span></p>
    <p>mouth: <button id="talk">talk</button> <span id="mouths"></span></p>
  </div>
</main>
<script>
  const root = document.getElementById('march');
  // mouth piece per mood and state
  const TABLE = {
    neutral:   { closed: 'closedSmile', half: 'halfSmile', open: 'openGrin' },
    happy:     { closed: 'closedGrin',  half: 'halfSmile', open: 'openGrin' },
    dry:       { closed: 'closedFlat',  half: 'halfFlat',  open: 'openFlat' },
    surprised: { closed: 'closedO',     half: 'halfO',     open: 'openO' },
  };
  let mouthState = 'closed';
  function paintMouth() {
    const mood = TABLE[root.dataset.mood] ? root.dataset.mood : 'neutral';
    const want = 'mo-' + TABLE[mood][mouthState];
    for (const el of root.querySelectorAll('.mouth > *')) el.style.visibility = el.id === want ? 'visible' : 'hidden';
  }
  window.marchMouth = function (state) { if (TABLE.neutral[state]) { mouthState = state; paintMouth(); } };
  new MutationObserver(paintMouth).observe(root, { attributes: true, attributeFilter: ['data-mood'] });

  // query params for screenshots
  const q = new URLSearchParams(location.search);
  if (q.get('mood')) root.dataset.mood = q.get('mood');
  if (q.get('action')) root.dataset.action = q.get('action');
  if (q.get('mouth')) mouthState = q.get('mouth');
  paintMouth();

  // the test strip
  function btn(parent, label, fn) { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; parent.appendChild(b); return b; }
  function mark(parent, on) { for (const b of parent.children) b.dataset.on = b.textContent === on ? '1' : '0'; }
  const moodsEl = document.getElementById('moods'), actsEl = document.getElementById('actions'), mouthsEl = document.getElementById('mouths');
  for (const m of ['neutral', 'happy', 'dry', 'surprised']) btn(moodsEl, m, () => { root.dataset.mood = m; mark(moodsEl, m); });
  for (const a of ['none', 'point', 'facepalm']) btn(actsEl, a, () => { root.dataset.action = a; mark(actsEl, a); });
  for (const s of ['closed', 'half', 'open']) btn(mouthsEl, s, () => { talking = false; marchMouth(s); mark(mouthsEl, s); });
  mark(moodsEl, root.dataset.mood); mark(actsEl, root.dataset.action); mark(mouthsEl, mouthState);
  let talking = false, t = 0;
  document.getElementById('talk').onclick = () => { talking = !talking; };
  setInterval(() => { if (!talking) return; t++; marchMouth(['open', 'half', 'closed', 'half'][t % 4]); mark(mouthsEl, mouthState); }, 40);
</script>
</body>
</html>
